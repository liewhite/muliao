[project]
name = "muliao"
version = "0.1.0"
description = "Personal multi-agent assistant built on pydantic-ai"
readme = "README.md"
authors = [
    { name = "liewhite", email = "liewhite@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "croniter>=6.2.4",
    "cryptography>=50.0.2",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "httpx2>=2.14.0",
    "openai>=3.35.1",
    "pydantic-ai-slim[anthropic,google,mcp,openai]>=2.57.0",
    "python-frontmatter>=1.3.0",
    "pywebpush>=2.5.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
muliao = "muliao.__main__:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# E501 由 formatter 负责；B008 是 FastAPI 依赖注入的惯用写法
ignore = ["E501", "B008"]
