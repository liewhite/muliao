[package]
name = "muliao-migrate"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "muliao-migrate"
path = "src/main.rs"

[dependencies]
muliao-platform = { workspace = true }
muliao-sessions = { workspace = true }
muliao-workspace = { workspace = true }
muliao-files = { workspace = true }
muliao-runtime = { workspace = true }
# 新库的表结构（MIGRATIONS）与检查时装配的新版服务都来自组合根
muliao-server = { workspace = true }
agenter = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
# functions：注册 SQL 函数 utc()，时间在 INSERT ... SELECT 里就地换格式
rusqlite = { workspace = true, features = ["functions"] }
serde = { workspace = true }
# raw_value：工具结果的结构化内容按旧库里的 JSON 原文迁（Value 不保留键的顺序）
serde_json = { workspace = true, features = ["raw_value"] }
tempfile = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
