# 仅供开发生成迁移：
#   uv run alembic upgrade head && uv run alembic revision --autogenerate -m "describe change"
# 运行时迁移由 muliao.db.migrate 在启动时执行，不读这个文件。
[alembic]
script_location = src/muliao/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///.alembic-dev.db
